<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>山旅旅</title>
<style>
  :root{--bg:#F6F1E7;--ink:#1F2A24;--green:#2F4F3E;--red:#C4472D;--card:#fff;--sub:#5a5f58}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:480px;margin:0 auto;padding:28px 16px 40px}
  .wait{text-align:center;padding-top:40px;font-size:15px;color:var(--sub)}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--red);margin:0}
  h1{font-size:22px;margin:4px 0 6px}
  .lead{font-size:13px;color:var(--sub);margin:0 0 18px;line-height:1.6}
  a.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
  .row img{width:72px;height:72px;object-fit:cover;border-radius:6px;flex:none;background:#eee}
  .rank{font-size:20px;font-weight:800;color:var(--red);width:28px;flex:none;text-align:center}
  .name{font-size:14px;font-weight:700;line-height:1.4}
  .price{font-size:13px;margin-top:4px}
  .note{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5}
  .go{margin-left:auto;font-size:18px;color:var(--green);flex:none}
  .icon{width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;background:var(--green)}
  .btn{display:block;text-align:center;margin-top:18px;padding:14px;border-radius:8px;background:var(--green);color:#fff;text-decoration:none;font-weight:700}
  footer{text-align:center;font-size:11px;color:var(--sub);margin-top:24px}
</style>
</head>
<body>
<main id="app"><p class="wait">山旅旅のページへ移動しています…</p></main>
<script>
(function () {
  // QRのクリックを数えるApps Script(記録だけ。移動はこのページがすぐ行う)
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwjakTGdKMn7lYYyxu_pA7CtkJspC35nlcbGkNNt25RvZV1J_j7f_p_EHA-1DECVkWD/exec';
  // 計測キーごとの行き先(毎号Claudeが更新する)
  var DATA_URL = 'https://yana0128.github.io/yamatabitabi-company/j/links.json';
  var STORE = 'https://store.yamatabi.shop/';

  var k = (new URLSearchParams(location.search).get('k') || '').trim().toUpperCase();
  var done = false;

  function log(src) {
    var u = GAS_URL + '?fmt=json&src=' + encodeURIComponent(src) + '&k=' + encodeURIComponent(k);
    try { fetch(u, { mode: 'no-cors', keepalive: true }); }
    catch (e) { new Image().src = u; }
  }
  function go(url) { if (done) return; done = true; location.replace(url); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function safe(url) { return /^https:\/\//.test(url || '') ? url : STORE; }

  // 3秒たっても行き先が分からなければ、計測用のApps Script経由で移動(こちらでも記録される)
  var timer = setTimeout(function () { go(k ? GAS_URL + '?src=fallback&k=' + encodeURIComponent(k) : STORE); }, 3000);

  if (!k) { clearTimeout(timer); go(STORE); return; }

  fetch(DATA_URL, { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (done) return;
      var e = (d.links || {})[k];
      if (!e) { clearTimeout(timer); go(GAS_URL + '?k=' + encodeURIComponent(k)); return; } // 古い号などはApps Scriptに任せる
      clearTimeout(timer);
      log('qr');
      if (e.url) { setTimeout(function () { go(safe(e.url)); }, 80); return; }
      done = true;
      if (e.page === 'ranking') renderRanking(e);
      else if (e.page === 'sns') renderSns(d.sns || []);
      else go(STORE);
    })
    .catch(function () { clearTimeout(timer); go(GAS_URL + '?src=fallback&k=' + encodeURIComponent(k)); });

  function bindClicks() {
    Array.prototype.forEach.call(document.querySelectorAll('a[data-src]'), function (a) {
      a.addEventListener('click', function () { log(a.getAttribute('data-src')); });
    });
  }

  function renderRanking(e) {
    document.title = (e.title || '人気ランキング') + '|山旅旅';
    var h = '<p class="eyebrow">RANKING</p><h1>' + esc(e.title || '先月の人気商品') + '</h1>' +
      '<p class="lead">' + esc(e.lead || 'オンラインストアで先月よく選ばれた商品です。') + '</p>';
    (e.items || []).forEach(function (it, i) {
      h += '<a class="row" data-src="rank' + (i + 1) + '" href="' + esc(safe(it.url)) + '">' +
        '<span class="rank">' + (i + 1) + '</span>' +
        (it.image ? '<img src="' + esc(it.image) + '" alt="" loading="lazy">' : '') +
        '<span><div class="name">' + esc(it.name) + '</div><div class="price">' + esc(it.price) + '</div></span>' +
        '<span class="go">›</span></a>';
    });
    h += '<a class="btn" data-src="rank-store" href="' + STORE + '">ストアのすべての商品を見る</a>' +
      '<footer>株式会社山旅旅</footer>';
    document.getElementById('app').innerHTML = h;
    bindClicks();
  }

  function renderSns(list) {
    document.title = 'SNS・ウェブマガジン|山旅旅';
    var h = '<p class="eyebrow">FOLLOW</p><h1>山旅旅をもっと身近に</h1>' +
      '<p class="lead">山の記事や動画を、好きな場所でどうぞ。</p>';
    list.forEach(function (s) {
      h += '<a class="row" data-src="sns-' + esc(s.id) + '" href="' + esc(safe(s.url)) + '">' +
        '<span class="icon" style="background:' + esc(s.color || '#2F4F3E') + '">' + esc(s.mark || s.name.charAt(0)) + '</span>' +
        '<span><div class="name">' + esc(s.name) + '</div><div class="note">' + esc(s.note || '') + '</div></span>' +
        '<span class="go">›</span></a>';
    });
    h += '<footer>株式会社山旅旅</footer>';
    document.getElementById('app').innerHTML = h;
    bindClicks();
  }
})();
</script>
</body>
</html>
